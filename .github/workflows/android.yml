name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine acceptance tests (AT01-AT12)
        run: ./gradlew --no-daemon :engine:test

      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK (unsigned unless signing secrets are set)
        env:
          CF_KEYSTORE_PATH: ${{ secrets.CF_KEYSTORE_PATH }}
          CF_KEYSTORE_PASSWORD: ${{ secrets.CF_KEYSTORE_PASSWORD }}
          CF_KEY_ALIAS: ${{ secrets.CF_KEY_ALIAS }}
          CF_KEY_PASSWORD: ${{ secrets.CF_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee release.log || {
            { grep -E -A8 "What went wrong" release.log; grep -E "^e: |Missing class|ERROR:|Error:" release.log; } | grep -v "^--" | grep -v "^\s*$" | head -14 | while read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Publish debug APK as a pre-release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          [ -f "$APK" ] || exit 0
          cp "$APK" coin-futures-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug coin-futures-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build" --notes "Debug APK built from $GITHUB_SHA by CI."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-futures-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            engine/build/reports/tests
            app/build/reports/tests
